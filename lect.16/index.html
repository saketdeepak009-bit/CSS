<!DOCTYPE html>

    <title>Flexbox</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            border: 2px solid red;
            display: flex;
            height: 80vh;
            justify-content: center;
            /* justify-self: start;
            justify-self:end;
            justify-content: space-around;
              justify-content: space-between;

              row-gap: 20px;
            column-gap: 20px;
            align-content: center;

            flex-direction: column;*/
            flex-direction: row;
            align-items: center;

            flex-wrap: wrap;
            align-content: flex-start;
            flex-flow: row wrap;

        }


        .item {
            /*flex-grow: 1;*/
            flex-shrink: 1;

            height: 60px;
            width: 60px;
            border: 2px solid black;
            margin: 5px;
            background-color: rgb(68, 43, 197);


        }

        .order-1 {
            order: 1;
        }

        .order-2 {
            order: 2;
        }

        .order-3 {
            order: 3;
        }

        .item1 {
            /*flex-grow: 2;*/
            flex-shrink: 2;
            align-self: flex-end;
        }
    </style>
</head>
